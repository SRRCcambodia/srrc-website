<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us | SRRC</title>

<link rel="stylesheet" href="assets/style.css">

<!-- Google reCAPTCHA v2 -->
<script src="https://www.google.com/recaptcha/api.js" async defer></script>

<style>

/* ===== CONTACT LAYOUT ===== */

.contact-wrapper{
display:grid;
grid-template-columns:1fr 1fr;
gap:60px;
max-width:1200px;
margin:100px auto;
padding:0 20px;
}

.contact-info{
background:#fff4ec;
padding:40px;
border-radius:12px;
}

.contact-info h3{
color:#f47b20;
margin-bottom:20px;
}

.contact-form{
background:white;
padding:40px;
border-radius:12px;
box-shadow:0 15px 50px rgba(0,0,0,0.05);
}

.form-group{
margin-bottom:20px;
display:flex;
flex-direction:column;
}

label{
font-weight:600;
margin-bottom:8px;
}

input, textarea{
padding:12px;
border:1px solid #ccc;
border-radius:6px;
transition:0.3s;
font-family:inherit;
}

input:focus, textarea:focus{
border-color:#f47b20;
outline:none;
}

.input-error{
border:2px solid #e53935;
background:#fff5f5;
}

.error-message{
color:#e53935;
font-size:14px;
margin-top:5px;
}

.btn-primary{
background:#f47b20;
color:white;
padding:14px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:600;
transition:0.3s;
width:100%;
}

.btn-primary:hover{
background:#d96512;
}

.spinner{
display:none;
width:18px;
height:18px;
border:3px solid white;
border-top:3px solid transparent;
border-radius:50%;
animation:spin 0.8s linear infinite;
margin-left:10px;
}

@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

.success-message{
display:none;
margin-top:20px;
padding:15px;
background:#e8f5e9;
color:#2e7d32;
border-radius:6px;
font-weight:500;
text-align:center;
}

@media(max-width:900px){
.contact-wrapper{
grid-template-columns:1fr;
}
}

</style>

</head>
<body>

<section class="contact-wrapper">

<!-- COMPANY INFO -->
<div class="contact-info">
<h3>SAMAKI RUNGROEUNG (CAMBODIA) CO., LTD</h3>

<p><strong>Address:</strong><br>
Phnom Penh, Cambodia</p>

<p><strong>Phone:</strong><br>
+855 974 055 678</p>

<p><strong>Email:</strong><br>
info@srrccambodia.com</p>

<p><strong>Working Hours:</strong><br>
Monday – Saturday<br>
08:00 – 17:30</p>

</div>

<!-- CONTACT FORM -->
<div class="contact-form">

<form id="contactForm" action="https://formspree.io/f/mnjbopvl" method="POST">

<!-- Honeypot -->
<input type="text" name="_gotcha" style="display:none">

<div class="form-group">
<label>Full Name *</label>
<input type="text" name="name" id="name" required>
<span class="error-message" id="nameError"></span>
</div>

<div class="form-group">
<label>Email *</label>
<input type="email" name="email" id="email" required>
<span class="error-message" id="emailError"></span>
</div>

<div class="form-group">
<label>Phone *</label>
<input type="tel" name="phone" id="phone" pattern="^\+?[0-9]{8,15}$" required>
<span class="error-message" id="phoneError"></span>
</div>

<div class="form-group">
<label>Message *</label>
<textarea name="message" id="message" minlength="10" required></textarea>
<span class="error-message" id="messageError"></span>
</div>

<div class="g-recaptcha" data-sitekey="6LeG03UsAAAAALpvvh33IAkfpBRuNrNlmEcMeE7q"></div>

<button type="submit" class="btn-primary">
<span id="btnText">Send Message</span>
<span class="spinner" id="spinner"></span>
</button>

<div id="successMessage" class="success-message">
Your message has been sent successfully. We will contact you as soon as possible.
</div>

</form>

</div>

</section>

<script>

const form = document.getElementById('contactForm');
const spinner = document.getElementById('spinner');
const btnText = document.getElementById('btnText');
const successMessage = document.getElementById('successMessage');

form.addEventListener('submit', async function(e){

e.preventDefault();

let valid = true;

// Reset
document.querySelectorAll('.error-message').forEach(el => el.textContent = '');
document.querySelectorAll('input, textarea').forEach(el => el.classList.remove('input-error'));

// ===== NAME =====
const name = document.getElementById('name').value.trim();
if(name.length < 3){
document.getElementById('nameError').textContent = "Full name must be at least 3 characters.";
document.getElementById('name').classList.add('input-error');
valid = false;
}

// ===== EMAIL =====
const email = document.getElementById('email').value.trim();
const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
if(!emailRegex.test(email)){
document.getElementById('emailError').textContent = "Please enter a valid email address.";
document.getElementById('email').classList.add('input-error');
valid = false;
}

// ===== PHONE =====
const phone = document.getElementById('phone').value.trim();
const phoneRegex = /^\+?[0-9]{8,15}$/;
if(!phoneRegex.test(phone)){
document.getElementById('phoneError').textContent = "Phone must be 8–15 digits, numbers only.";
document.getElementById('phone').classList.add('input-error');
valid = false;
}

// ===== MESSAGE =====
const message = document.getElementById('message').value.trim();
if(message.length < 10){
document.getElementById('messageError').textContent = "Message must be at least 10 characters.";
document.getElementById('message').classList.add('input-error');
valid = false;
}

if(!valid) return;

// Loading
spinner.style.display = "inline-block";
btnText.style.display = "none";

const data = new FormData(form);

try{
await fetch(form.action,{
method:form.method,
body:data,
headers:{'Accept':'application/json'}
});

form.reset();
successMessage.style.display="block";
grecaptcha.reset();
}
catch{
alert("There was an error. Please try again.");
}

spinner.style.display="none";
btnText.style.display="inline";

});

</script>

</body>
</html>
